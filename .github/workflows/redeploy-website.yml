name: Validate and rebuild website

# Every change that lands on main (admin panel commit or manual edit) validates the data and
# then asks Cloudflare Pages to rebuild the website so the static pages pick up the new content.
on:
  push:
    branches: [main]
    paths:
      - "**.json"
      - "photos/**"
      - "members/**"
  workflow_dispatch: {}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate
        run: node scripts/validate.mjs

      - name: Collect changed files
        id: changed
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only HEAD~1 HEAD || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Rebuild website
        env:
          WEBSITE_DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/redeploy-website.mjs
